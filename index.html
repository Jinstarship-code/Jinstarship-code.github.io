<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뱀피르</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="header-row">
        <h2>🧛‍♂️ 뱀피르</h2>
        <button id="themeToggleBtn" class="theme-toggle-btn">🌙 다크모드</button>
    </div>

    <div class="tab-menu">
        <button id="btn-lobby" class="tab-btn active" data-tab="lobby">🏠 로비</button>
        <button id="btn-notice" class="tab-btn" data-tab="notice">📢 공지사항</button>
        <button id="btn-info" class="tab-btn" data-tab="info">📖 정보</button>
        <button id="btn-utility" class="tab-btn" aria-haspopup="true" aria-expanded="false">🧰 유틸리티 ▾</button>
        <button id="btn-settings" class="tab-btn" data-tab="settings">⚙ 설정</button>
    </div>

    <!-- 유틸리티 드롭다운 (항목은 js/data.js의 UTILITY_ITEMS) -->
    <div id="utilityMenu" class="submenu"></div>

    <!-- 명중 계산 탭 -->
    <div id="accuracy" class="tab-content">
        <div class="notice">수치를 입력하면 보스 테이블에 즉시 반영됩니다.</div>
        <div class="container">
            <div class="input-section">
                <table class="input-table">
                    <tr><th>명중</th><td><input type="number" id="stat1" value="0"></td></tr>
                    <tr><th>클래스 명중</th><td><input type="number" id="stat2" value="0"></td></tr>
                    <tr><th>일명/스명</th><td><input type="number" id="stat3" value="0"></td></tr>
                    <tr><th>보스 명중</th><td><input type="number" id="stat4" value="0"></td></tr>
                    <tr style="background:var(--surface);"><th>합계</th><td id="totalBox" class="total-box">0</td></tr>
                </table>
            </div>

            <div class="boss-section">
                <table class="boss-table">
                    <thead id="bossTableHead"></thead>
                    <tbody id="bossTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 가챠 시뮬레이션 탭 -->
    <div id="gacha" class="tab-content">
        <div class="notice">테스트용 시뮬레이션이며 등급 색상만 표시됩니다. (11연차 1회 = 2,000 다이아)</div>
        <div class="container">
            <div class="gacha-section">
                <button id="gachaPullBtn" class="gacha-pull-btn">🎰 11연차 뽑기</button>
                <div class="gacha-dia-row">
                    뽑기 횟수: <span id="gachaPullCount" class="total-box">0</span>
                    <button id="gachaResetBtn" class="gacha-reset-btn">초기화</button>
                </div>
                <div class="gacha-dia-row">
                    누적 사용 다이아: <span id="gachaDiaTotal" class="total-box">0</span>
                </div>
                <div class="gacha-dia-row">
                    케어포인트: <span id="gachaCarePoints" class="total-box">0</span><span id="gachaCareGoal" class="care-goal"></span>
                    <span id="gachaPityBadge" class="pity-badge" style="display:none;">
                        <svg viewBox="0 0 24 32" width="15" height="20" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="29" rx="3" fill="#f5c518" stroke="#b8860b" stroke-width="1.5"/><path d="M12 8l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#fff8dc"/></svg>
                        <span id="gachaPityText"></span>
                    </span>
                </div>
                <div id="gachaResults" class="gacha-results"></div>
            </div>
        </div>
    </div>

    <!-- 로비 탭 -->
    <div id="lobby" class="tab-content active">
        <div class="lobby-title">
            <h3>🧛‍♂️ 뱀피르 소식</h3>
            <p>카드를 누르면 자세한 내용을 볼 수 있어요</p>
        </div>
        <div id="newsGrid" class="news-grid"></div>
    </div>

    <!-- 공지사항 탭 -->
    <div id="notice" class="tab-content">
        <div class="lobby-title">
            <h3>📢 공지사항</h3>
            <p>길드 공지를 확인하세요</p>
        </div>
        <div id="noticeList" class="notice-list"></div>
    </div>

    <!-- 정보 탭 (길드 활동 정리) -->
    <div id="info" class="tab-content">
        <div class="info-layout">
            <div id="infoMenu" class="info-menu"></div>

            <div id="infoPanelWrap" class="info-panel-wrap"></div>
        </div>
    </div>

    <!-- 설정 탭 -->
    <div id="settings" class="tab-content">
        <div class="notice">고정된 재화 단가 리스트입니다.</div>
        <div class="container">
            <div class="settings-section">
                <h3>💎 재화 가치 기준 설정</h3>
                <table class="cfg-table">
                    <tr><th>1다이아 당 가치</th><td>13.75원</td></tr>
                    <tr><th>11회 소환권 가치</th><td>27,500원</td></tr>
                </table>
            </div>
        </div>
    </div>

    <!-- 공식 홈페이지 바로가기 (우측 하단 플로팅) -->
    <a class="home-fab" href="https://vampir.netmarble.com" target="_blank" rel="noopener noreferrer" title="뱀피르 공식 홈페이지" aria-label="뱀피르 공식 홈페이지로 이동">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3L12 3z"/></svg>
    </a>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/accuracy.js"></script>
    <script src="js/gacha.js"></script>
    <script src="js/lobby.js"></script>
    <script src="js/dummy.js"></script>
    <script src="js/info.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
